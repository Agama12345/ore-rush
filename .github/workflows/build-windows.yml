name: Build Windows app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install game dependencies
        run: npm ci

      - name: Build game
        run: npm run build

      - name: Install desktop wrapper dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: Ore-Rush-Windows
          path: desktop/release/*.exe

      - name: Publish installer to public download repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOWNLOAD_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Brak sekretu DOWNLOAD_TOKEN, pomijam publikacje."
            exit 0
          fi
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" desktop/release/*.exe \
            --repo Agama12345/ore-rush-download \
            --title "Ore Rush ${TAG}" \
            --notes "Pobierz plik Setup i uruchom instalator. Potem wystarczy dwuklik na ikonę gry."
