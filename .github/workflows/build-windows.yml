name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install game dependencies
        run: npm ci

      - name: Build game
        run: npm run build

      - name: Install desktop wrapper dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: Ore-Rush-Windows
          path: desktop/release/*.exe

      - name: Publish installer to Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          cp dist/index.html ore-rush-web.html
          gh release create "$TAG" desktop/release/*.exe ore-rush-web.html \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ore Rush ${TAG}" \
            --notes "Pobierz plik Setup i uruchom instalator."
